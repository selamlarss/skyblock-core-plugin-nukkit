# ==========================================
#  SkyCore - Ana Ayar Dosyasi
# ==========================================

economy:
  starting-balance: 100.0
  currency-symbol: "$"

island:
  world-name: "skyblock"
  size: 100              # ada basina ayrilan alan (blok)
  start-x: 0
  start-z: 0
  start-y: 100
  spacing: 300            # adalar arasi mesafe
  max-members: 6
  level-per-block-value: 0.5

scoreboard:
  title: "&b&lSkyBlock"
  update-interval-ticks: 20
  lines:
    - "&7-----------------"
    - "&fOyuncu: &a{player}"
    - "&fRutbe: {rank}"
    - "&fBakiye: &a{currency}{balance}"
    - "&fAda Seviyesi: &e{islandlevel}"
    - "&7-----------------"
    - "&fOnline: &a{online}"

ranks:
  order: [owner, admin, moderator, vip, default]
  default:
    prefix: "&7[Uye]&r "
    color: "&7"
    chat-format: "{prefix}{player}&f: {message}"
  vip:
    prefix: "&a[VIP]&r "
    color: "&a"
    chat-format: "{prefix}{player}&f: {message}"
  moderator:
    prefix: "&b[Mod]&r "
    color: "&b"
    chat-format: "{prefix}{player}&f: {message}"
  admin:
    prefix: "&c[Admin]&r "
    color: "&c"
    chat-format: "{prefix}{player}&f: {message}"
  owner:
    prefix: "&4[Kurucu]&r "
    color: "&4"
    chat-format: "{prefix}{player}&f: {message}"

